version: '3.8'
services:
  backend:
    image: backend:latest
    container_name: backend_api
    restart: always
    environment:
      PORT: 5000
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: mysql
      DB_NAME: app_db
    ports:
      - "5000:5000"
