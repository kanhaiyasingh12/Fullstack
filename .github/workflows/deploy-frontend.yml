name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:latest

      - name: Prepare frontend deploy files
        run: |
          set -e
          FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:${{ github.sha }}"
          sed -i "s|image: .*|image: ${FRONTEND_IMAGE}|g" frontend/docker-compose.yaml

      - name: Copy frontend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: frontend/docker-compose.yaml
          target: /home/ubuntu/website/frontend

      - name: Deploy frontend on Docker Swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/website/frontend
            docker stack deploy -c frontend/docker-compose.yaml frontend
