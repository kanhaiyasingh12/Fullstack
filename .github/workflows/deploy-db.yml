name: Deploy DB

on:
  workflow_dispatch:

jobs:
  deploy-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: ./db-init
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-db:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-db:latest

      - name: Prepare db deploy files
        run: |
          set -e
          DB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fullstack-db:${{ github.sha }}"
          mkdir -p deploy/db-init
          cp db-init/docker-compose.yaml deploy/db-init/docker-compose.yaml
          sed -i "s|image: .*|image: ${DB_IMAGE}|g" deploy/db-init/docker-compose.yaml

      - name: Copy db files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy
          target: ${{ secrets.SSH_DEPLOY_PATH }}

      - name: Deploy db on Docker Swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}/deploy"
            docker stack deploy -c db-init/docker-compose.yaml db
