name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:latest

      - name: Prepare backend deploy files
        run: |
          set -e
          BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:${{ github.sha }}"
          mkdir -p deploy/backend
          cp backend/docker-compose.yaml deploy/backend/docker-compose.yaml
          sed -i "s|image: .*|image: ${BACKEND_IMAGE}|g" deploy/backend/docker-compose.yaml

      - name: Copy backend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy
          target: ${{ secrets.SSH_DEPLOY_PATH }}

      - name: Deploy backend on Docker Swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}/deploy"
            docker stack deploy -c backend/docker-compose.yaml backend
